version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-acharya-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://acharya:acharya_secure_password@db:5432/acharya_db
    volumes:
      - ./app/data:/app/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - acharya-network

  db:
    image: pgvector/pgvector:pg16
    container_name: ai-acharya-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=acharya_db
      - POSTGRES_USER=acharya
      - POSTGRES_PASSWORD=acharya_secure_password
    volumes:
      - acharya_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acharya -d acharya_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acharya-network

volumes:
  acharya_pgdata:
    driver: local

networks:
  acharya-network:
    driver: bridge
