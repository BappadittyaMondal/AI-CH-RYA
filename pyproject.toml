[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-acharya"
version = "3.0.0"
description = "AI ĀCHĀRYA — Sanātana Jñāna, Śāstra, Saṃskṛti & Lifelong Learning Engine"
readme = "MASTER_SYSTEM_PROMPT.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["app/tests", "tests"]
